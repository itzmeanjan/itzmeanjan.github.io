<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-labelledby="t d">
  <title id="t">Pipelined KangarooTwelve Hashing</title>
  <desc id="d">Batches of N leaf chunks flow through three stages: compute chaining values on the GPU, copy them to host memory over PCIe, and absorb them into the root sponge on the host. Each batch starts one slot later than the previous one, so in steady state three batches are in flight at once and all three stages stay busy.</desc>

  <defs>
    <style>
      .ttl  { font: 600 16px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #BCF5A9; }
      .row  { font: 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #b9c9d0; }
      .blk  { font: 11px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .ax   { font: 11px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #93a7af; }
      .note { font: 12px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #dfeaee; }
      .lg   { font: 11.5px "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 z" fill="#8fa3ab"/>
    </marker>
  </defs>

  <text class="ttl" x="450" y="26" text-anchor="middle">Pipelined KangarooTwelve Hashing</text>

  <!-- ============ time gridlines ============ -->
  <g stroke="#55666e" stroke-width="1" opacity="0.55">
    <line x1="150" y1="70" x2="150" y2="346"/>
    <line x1="234" y1="70" x2="234" y2="346"/>
    <line x1="318" y1="70" x2="318" y2="346"/>
    <line x1="402" y1="70" x2="402" y2="346"/>
    <line x1="486" y1="70" x2="486" y2="346"/>
    <line x1="570" y1="70" x2="570" y2="346"/>
    <line x1="654" y1="70" x2="654" y2="346"/>
    <line x1="738" y1="70" x2="738" y2="346"/>
    <line x1="822" y1="70" x2="822" y2="346"/>
  </g>

  <!-- slot labels -->
  <g class="ax" text-anchor="middle">
    <text x="192" y="62">t₀</text>
    <text x="276" y="62">t₁</text>
    <text x="360" y="62">t₂</text>
    <text x="444" y="62">t₃</text>
    <text x="528" y="62">t₄</text>
    <text x="612" y="62">t₅</text>
    <text x="696" y="62">t₆</text>
    <text x="780" y="62">t₇</text>
  </g>

  <!-- ============ host row : chunk 0 ============ -->
  <text class="row" x="140" y="96" text-anchor="end" fill="#a9d69a">Host</text>
  <rect x="150" y="78" width="168" height="26" rx="4" fill="#2f4a3a" stroke="#BCF5A9" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="blk" x="234" y="96" text-anchor="middle" fill="#d8f6c8" font-size="10">Root sponge absorbs Chunk<tspan font-size="8" dy="3">0</tspan></text>

  <!-- ============ batch rows ============ -->
  <!-- batch 0 : slots 0,1,2 -->
  <text class="row" x="140" y="138" text-anchor="end">Batch<tspan font-size="9" dy="3">0</tspan></text>
  <rect x="150" y="120" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.4"/>
  <text class="blk" x="192" y="138" text-anchor="middle" fill="#cfe8f2">compute</text>
  <rect x="234" y="120" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.4"/>
  <text class="blk" x="276" y="138" text-anchor="middle" fill="#f7e6bf">copy</text>
  <rect x="318" y="120" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.4"/>
  <text class="blk" x="360" y="138" text-anchor="middle" fill="#cdeee6">absorb</text>

  <!-- batch 1 : slots 1,2,3 -->
  <text class="row" x="140" y="176" text-anchor="end">Batch<tspan font-size="9" dy="3">1</tspan></text>
  <rect x="234" y="158" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.4"/>
  <text class="blk" x="276" y="176" text-anchor="middle" fill="#cfe8f2">compute</text>
  <rect x="318" y="158" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.4"/>
  <text class="blk" x="360" y="176" text-anchor="middle" fill="#f7e6bf">copy</text>
  <rect x="402" y="158" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.4"/>
  <text class="blk" x="444" y="176" text-anchor="middle" fill="#cdeee6">absorb</text>

  <!-- batch 2 : slots 2,3,4 -->
  <text class="row" x="140" y="214" text-anchor="end">Batch<tspan font-size="9" dy="3">2</tspan></text>
  <rect x="318" y="196" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.4"/>
  <text class="blk" x="360" y="214" text-anchor="middle" fill="#cfe8f2">compute</text>
  <rect x="402" y="196" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.4"/>
  <text class="blk" x="444" y="214" text-anchor="middle" fill="#f7e6bf">copy</text>
  <rect x="486" y="196" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.4"/>
  <text class="blk" x="528" y="214" text-anchor="middle" fill="#cdeee6">absorb</text>

  <!-- batch 3 : slots 3,4,5 -->
  <text class="row" x="140" y="252" text-anchor="end">Batch<tspan font-size="9" dy="3">3</tspan></text>
  <rect x="402" y="234" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.4"/>
  <text class="blk" x="444" y="252" text-anchor="middle" fill="#cfe8f2">compute</text>
  <rect x="486" y="234" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.4"/>
  <text class="blk" x="528" y="252" text-anchor="middle" fill="#f7e6bf">copy</text>
  <rect x="570" y="234" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.4"/>
  <text class="blk" x="612" y="252" text-anchor="middle" fill="#cdeee6">absorb</text>

  <!-- batch 4 : slots 4,5,6 -->
  <text class="row" x="140" y="290" text-anchor="end">Batch<tspan font-size="9" dy="3">4</tspan></text>
  <rect x="486" y="272" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.4"/>
  <text class="blk" x="528" y="290" text-anchor="middle" fill="#cfe8f2">compute</text>
  <rect x="570" y="272" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.4"/>
  <text class="blk" x="612" y="290" text-anchor="middle" fill="#f7e6bf">copy</text>
  <rect x="654" y="272" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.4"/>
  <text class="blk" x="696" y="290" text-anchor="middle" fill="#cdeee6">absorb</text>

  <!-- trailing batches -->
  <text class="row" x="140" y="330" text-anchor="end" fill="#8fa3ab">⋮</text>
  <rect x="570" y="310" width="84" height="26" rx="4" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <rect x="654" y="310" width="84" height="26" rx="4" fill="#4a4331" stroke="#f0c979" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <rect x="738" y="310" width="84" height="26" rx="4" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text class="blk" x="612" y="328" text-anchor="middle" fill="#7e93a0" font-size="10">compute</text>
  <text class="blk" x="696" y="328" text-anchor="middle" fill="#8c7f60" font-size="10">copy</text>
  <text class="blk" x="780" y="328" text-anchor="middle" fill="#6f8f86" font-size="10">absorb</text>

  <!-- ============ time axis ============ -->
  <line x1="150" y1="358" x2="860" y2="358" stroke="#8fa3ab" stroke-width="1.4" marker-end="url(#ah)"/>
  <text class="ax" x="856" y="376" text-anchor="end">time →</text>

  <!-- ============ legend ============ -->
  <g>
    <rect x="150" y="390" width="14" height="14" rx="3" fill="#2f4a5c" stroke="#79b8d6" stroke-width="1.3"/>
    <text class="lg" x="172" y="402" fill="#cfe8f2">Stage 1 · Compute CVs on GPU</text>

    <rect x="408" y="390" width="14" height="14" rx="3" fill="#4a4331" stroke="#f0c979" stroke-width="1.3"/>
    <text class="lg" x="430" y="402" fill="#f7e6bf">Stage 2 · Copy CVs to host</text>

    <rect x="643" y="390" width="14" height="14" rx="3" fill="#2f4a44" stroke="#7fd6c0" stroke-width="1.3"/>
    <text class="lg" x="665" y="402" fill="#cdeee6">Stage 3 · Absorb CVs into root on host</text>
  </g>
</svg>
